name: norday_flutter_core
description: >-
  Motor compartido del ecosistema Norday: red, temas, gamificación, mascota,
  onboarding y preferencias. Genérico y sin conceptos de dominio — las apps
  que lo consumen ponen los disparadores.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.0
  shared_preferences: 2.2.2
  google_sign_in: ^6.2.1
  google_fonts: ^8.1.0
  lottie: ^3.1.2
  audioplayers: ^6.1.0
  lucide_icons_flutter: ^3.1.15
  firebase_messaging: ^16.4.1
  firebase_analytics: ^12.4.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/animations/
    - assets/sounds/
    - assets/mascota/
    - assets/avatares/
