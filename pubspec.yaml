name: norday_flutter_core
description: >-
  Motor compartido del ecosistema Norday: red, temas, gamificación, mascota,
  onboarding y preferencias. Genérico y sin conceptos de dominio — las apps
  que lo consumen ponen los disparadores.
version: 0.59.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.1.0
  google_sign_in: ^7.2.0
  # Las familias de las identidades (Space Grotesk, Manrope, Chakra Petch,
  # IBM Plex Sans, Quicksand, Nunito y Caveat) NO se
  # resuelven por HTTP: van empaquetadas como assets en la app que consume
  # este paquete —`habitos_app_mobile/google_fonts/`—, que es donde hay que
  # tocarlas. `google_fonts` mira primero en los assets y sólo baja por red
  # si no encuentra el fichero, así que borrar uno que el código sí pide no
  # da error: lo descarga en silencio.
  # Sin itálicas: ninguna identidad pide `FontStyle.italic`.
  google_fonts: ^8.1.0
  lottie: ^3.1.2
  audioplayers: ^6.1.0
  lucide_icons_flutter: ^3.1.15
  firebase_messaging: ^16.4.1
  firebase_analytics: ^12.4.3
  permission_handler: ^12.0.3
  play_install_referrer: ^0.5.0
  in_app_update: ^5.0.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/animations/
    - assets/sounds/
    - assets/mascota/
    # Nori canónica (Nori vestida, N-9): solo el cuerpo y el brote de las 12,
    # uno a uno. Las máscaras de la pantalla y geometria.json son de las
    # herramientas y no entran en las apps.
    - assets/mascota/canonica/Nori_huevo_sonriente_cuerpo.png
    - assets/mascota/canonica/Nori_huevo_sonriente_brote.png
    - assets/mascota/canonica/Nori_huevo_triste_cuerpo.png
    - assets/mascota/canonica/Nori_huevo_triste_brote.png
    - assets/mascota/canonica/Nori_huevo_dormido_cuerpo.png
    - assets/mascota/canonica/Nori_huevo_dormido_brote.png
    - assets/mascota/canonica/Nori_huevo_exultante_cuerpo.png
    - assets/mascota/canonica/Nori_huevo_exultante_brote.png
    - assets/mascota/canonica/Nori_cria_sonriente_cuerpo.png
    - assets/mascota/canonica/Nori_cria_sonriente_brote.png
    - assets/mascota/canonica/Nori_cria_triste_cuerpo.png
    - assets/mascota/canonica/Nori_cria_triste_brote.png
    - assets/mascota/canonica/Nori_cria_dormido_cuerpo.png
    - assets/mascota/canonica/Nori_cria_dormido_brote.png
    - assets/mascota/canonica/Nori_cria_exultante_cuerpo.png
    - assets/mascota/canonica/Nori_cria_exultante_brote.png
    - assets/mascota/canonica/Nori_adulto_sonriente_cuerpo.png
    - assets/mascota/canonica/Nori_adulto_sonriente_brote.png
    - assets/mascota/canonica/Nori_adulto_triste_cuerpo.png
    - assets/mascota/canonica/Nori_adulto_triste_brote.png
    - assets/mascota/canonica/Nori_adulto_dormido_cuerpo.png
    - assets/mascota/canonica/Nori_adulto_dormido_brote.png
    - assets/mascota/canonica/Nori_adulto_exultante_cuerpo.png
    - assets/mascota/canonica/Nori_adulto_exultante_brote.png
    - assets/avatares/
